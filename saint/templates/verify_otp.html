{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <style>
        body {
            background: linear-gradient(to bottom, #905B28, #FFB92C);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: #FFB92C;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            color: #905B28;
            width: 400px;
            height: 400px;
            border: 2px solid #000000;
        }
        .container h2 {
            margin-bottom: 20px;
            font-size: 30px;
            margin-top: 5px;
            
        }
        .logo {
            width: 300px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: white;
            font-size: 20px;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 60px;
            margin-top: 16px;
            border-radius: 5px;
            border: none;
            border: 2px solid #000000;
        }
        button {
            background-color: #905B28;
            border: none;
            padding: 10px;
            width: 85%;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            color: #ffffff;
            border: 2px solid #000000;
        }
        button:hover {
            background-color: #FFA000;
        }
    </style>
</head>
{% block content %}
<body>
<div class="container">
    <h2>เข้าสู่ระบบ</h2>
    <img src="{% static 'images/kk.png' %}" pzlt="Crepe Logo" class="logo">
<form method="POST">
    {% csrf_token %}
    <label>กรอก OTP:</label>
    <input type="text" name="otp" required>
    <button type="submit">ยืนยัน</button>
</form>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}
</div>
</body>
</html>
{% endblock %}
