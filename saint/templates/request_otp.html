{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนเข้าสู่ระบบ</title>
    <style>
        body {
            background: linear-gradient(to bottom, #FFA726, #FFCC80);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: #8B5E3C;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            color: #FFD700;
            width: 400px;
            height: 400px;
        }
        .container h2 {
            margin-bottom: 10px;
        }
        .logo {
            width: 150px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: white;
            font-size: 20px;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 60px;
            margin-top: 16px;
            border-radius: 5px;
            border: none;
            border: 2px solid #000000;
        }
        button {
            background-color: #FFC107;
            border: none;
            padding: 10px;
            width: 85%;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            border: 2px solid #000000;
        }
        button:hover {
            background-color: #FFA000;
        }
    </style>
</head>
{% block content %}
<body>

    <div class="container">
        <h2>ลงทะเบียนเข้าสู่ระบบ</h2>
        <img src="{% static 'images/aa.png' %}" pzlt="Crepe Logo" class="logo">
        <form method="POST">
            {% csrf_token %}
            <label>อีเมล</label>
            <input type="email" name="email" required>
            <button type="submit">ยืนยัน</button>
        </form>
    </div>

</body>
</html>
{% endblock %}
