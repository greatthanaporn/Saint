{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}I say ROAR{% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <a href="{% url 'order_crepe' %}">
                <img src="{% static 'images/aa.png' %}" alt="Crepe Logo">
            </a>
        </div>
  

        <!-- Navigation Links -->
        <ul class="nav-links">
            <li>
                <a href="{% url 'order_crepe' %}" class="nav-item {% if request.resolver_match.url_name == 'order_crepe' %}active{% endif %}">
                    <div class="icon-background">
                        <i class="fas fa-store"></i> <!-- ไอคอนสั่งซื้อ -->
                    </div>
                    สั่งซื้อ
                </a>
            </li>   
            <li>
                <a href="{% url 'cart' %}" class="nav-item {% if request.resolver_match.url_name == 'cart' %}active{% endif %}">
                    <div class="icon-background">
                        <i class="fas fa-shopping-cart"></i> <!-- ไอคอนตะกร้า -->
                    </div>
                    ตะกร้า
                </a>
            </li>
            <li>
                <li>
                    <a href="{% url 'my_orders' %}" class="nav-item {% if request.resolver_match.url_name == 'my_orders' %}active{% endif %}">
                        <div class="icon-background1">
                            <img src="{% static 'images/ee1.png' %}" alt="My Orders">
                        </div>
                        คำสั่งซื้อของฉัน
                    </a>
                </li>
        </ul>

        <!-- Profile & Login/Register -->
        <div class="profile-section">
            <a href="#" class="profile-link">
                <div class="profile-img-container">
                    <img src="{{ user.profile.get_profile_picture }}" alt="Profile" class="profile-img">
                </div>
            </a>
        </div>
    </div>
</nav>

    <!-- Content Block -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
