{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}I say ROAR{% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/Admin/admin_navbar.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
    <div class="container1">
        <!-- Logo -->
        <div class="logo">
            <a href="{% url 'Dashboard' %}">
                <img src="{% static 'images/aa.png' %}" alt="Crepe Logo">
            </a>
        </div>
  

        <!-- Navigation Links -->
        <ul class="nav-links">
            <li>
                <a href="{% url 'Dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'Dashboard' %}active{% endif %}">
                    <div class="icon-background">
                        <i class="fas fa-store"></i> <!-- ไอคอนสั่งซื้อ -->
                    </div>
                    Dashboard
                </a>
            </li>   
            <li>
                <a href="{% url 'admin_order' %}" class="nav-item {% if request.resolver_match.url_name == 'admin_order' %}active{% endif %}">
                    <div class="icon-background">
                        <i class="fas fa-shopping-cart"></i> <!-- ไอคอนตะกร้า -->
                    </div>
                    ออเดอร์
                </a>
            </li>
            
                <li>
                    <a href="{% url 'add_menu' %}" class="nav-item {% if request.resolver_match.url_name == 'add_menu' %}active{% endif %}">
                        <div class="icon-background1">
                            <img src="{% static 'images/ee1.png' %}" alt="My Orders">
                        </div>
                        เพิ่มเมนู
                    </a>
                </li>
                <li>
                    <a href="{% url 'order_history_admin' %}" class="nav-item {% if request.resolver_match.url_name == 'order_history_admin' %}active{% endif %}">
                        <div class="icon-background">
                            <i class="fas fa-history"></i> 
                        </div>
                        ประวัติคำสั่งซื้อ
                    </a>
                </li>
        </ul>

        <!-- Profile & Dropdown Menu -->
        <div class="profile-section">
            <a href="#" class="profile-link" id="profileToggle">
                <div class="profile-img-container">
                    <i class="fas fa-user"></i>
                </div>
            </a>

            <!-- Profile Dropdown -->
            <div class="profile-dropdown" id="profileDropdown">
                <p><i class="fas fa-user"></i> {{ user.email }}</p>
                <a href="{% url 'logout' %}" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
                </a>
            </div>
    </div>
    </div>
</nav>

    <!-- Content Block -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let profileToggle = document.getElementById("profileToggle");
            let profileDropdown = document.getElementById("profileDropdown");
        
            profileToggle.addEventListener("click", function(event) {
                event.preventDefault();
                profileDropdown.classList.toggle("show");
            });
        
            document.addEventListener("click", function(event) {
                if (!profileToggle.contains(event.target) && !profileDropdown.contains(event.target)) {
                    profileDropdown.classList.remove("show");
                }
            });
        });
        </script>
        

</body>
</html>
